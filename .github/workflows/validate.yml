name: Validate BLACK SIGNAL
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional LuaJIT validator
        run: python -m pip install lupa==2.6
      - name: Validate sources
        run: python tools/validate.py
      - name: Build separate downloads and FOMOD
        run: python tools/build.py
      - name: Validate archives
        run: python tools/validate.py --archives
